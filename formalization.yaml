      that count, and the equality with the factor language of g_fib(b5) is
      the companion paper's. The rest of this paper is not recorded as read.
    author_endorsement: not-contacted
  - title: "Sequences with subword complexity 2n"
    authors:
      - "Günter Rote"
    id: "https://doi.org/10.1006/jnth.1994.1012"
    type: paper
    location: "Journal of Number Theory 46(2) (1994), 196-213, Theorem 3"
    relationship: independently-proves
    note: >-
      The compared theorem b5_rote_fibonacci_projection independently gives
      the 2n complexity count for the Rote-Fibonacci word at positive
      lengths. Du et al. (arXiv:1406.0670v4, Theorem 43) derive this case
      from Rote's Theorem 3 and their Corollary 36. The equality of factor
      languages with g_rf(b5) is the companion paper's result. Metadata
      checked against Crossref; Rote's paper is recorded as unread (paywalled)
      [to check], as in the companion's references-checked.md row rote1994.
    author_endorsement: not-contacted
  - title: "Symbolic Dynamics II. Sturmian Trajectories"
    authors:
      - "Marston Morse"
      - "Gustav A. Hedlund"
    id: "https://doi.org/10.2307/2371431"
    type: paper
    location: "American Journal of Mathematics 62(1) (1940), 1-42"
    relationship: independently-proves
    note: >-
      Source of the classical count of n + 1 factors of each length for
      Sturmian words, credited by Du et al. (arXiv:1406.0670v4, before
      Theorem 57). The compared theorem b5_sturmian_projection, by
      identifying the factor set of g_fib(b5) with that of the Fibonacci word
      and counting it, also gives this count for the Fibonacci word. Unread
      (paywalled) [to check]; credited through Du et al.
    author_endorsement: n/a

