      (x + 1)(x^2 - x - 1)(x^2 - x + 1), so the unit-modulus eigenvalues -1 and
      exp(+-i pi/3) are simple roots of unity, alpha2 = 0 and the n0 of Appendix
      B is 6. Checked here against the printed definitions: the weight psi = (1,
      -2, 1, 1, -1) satisfies psi M = -psi, so it is orthogonal to the Perron
      vector and fixed by M^6; f5^4(0) = 01234210423 is a prefix of f5^6(0), so
      (0, 0, 0123421) is an elementary loop (Definition 27) of the prefix
      automaton of f5^6 with psi-weight -1; hence A is nonzero (a numerical
      evaluation over all 55093 elementary loops gives A = 3.236 to three
      places), and Theorem 13(iv) gives a balance function of order log N,
      unbounded. That is the conclusion of the compared b5_not_C_balanced, which
      proves it directly through an explicit factor family. The paper does not
      treat f5; the instance is the computation above. Theorem 13 rests on
      Theorem 5, which the paper takes from the preprint "Symbolic discrepancy
      and self-similar dynamics", not read here [to check].
    author_endorsement: not-contacted
