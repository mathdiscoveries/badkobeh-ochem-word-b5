  - title: "Balances for fixed points of primitive substitutions"
    authors:
      - "Boris Adamczewski"
    id: "https://doi.org/10.1016/S0304-3975(03)00092-6"
    type: paper
    location: "Theoretical Computer Science 307 (2003), 47-75, Section 4, Theorem 13(iv) and Corollary 15, with Appendix B, Definition 27"
    relationship: independently-proves
    note: >-
      Read in full in the published version on the author's page
      (adamczewski.perso.math.cnrs.fr, journal pagination). Corollary 15 (page
      58): "A fixed point U of a primitive substitution sigma has a bounded
      balance function if and only if [...] (i) |theta2| < 1, (ii) |theta2| = 1,
