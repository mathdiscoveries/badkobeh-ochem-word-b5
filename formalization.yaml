    author_endorsement: not-contacted
  - title: "Decision Algorithms for Fibonacci-Automatic Words, with Applications to Pattern Avoidance"
    authors:
      - "Chen Fei Du"
      - "Hamoon Mousavi"
      - "Luke Schaeffer"
      - "Jeffrey Shallit"
    id: "https://arxiv.org/abs/1406.0670"
    type: paper
    location: "arXiv:1406.0670v4 (2014), Theorems 43 and 57"
    relationship: independently-proves
    note: >-
      Theorem 43 proves that the Rote-Fibonacci word has subword complexity 2n
      and Theorem 57 reproves the classical theorem of Morse and Hedlund
      (listed below) that the Fibonacci word has subword complexity n + 1. Du
      et al. name and describe the Rote-Fibonacci word in Section 5; it
      belongs to the family of words of complexity 2n characterized by
      Gunter Rote (1994, Theorem 3). The compared theorems
      b5_sturmian_projection and b5_rote_fibonacci_projection, by identifying
      the factor sets and counting them, also give these two counts for the
      reference words; the projection equalities for b5 are the companion
      paper's. Read in full (arXiv v4).
    author_endorsement: not-contacted
  - title: "Decision Algorithms for Fibonacci-Automatic Words, III: Enumeration and Abelian Properties"
    authors:
      - "Chen Fei Du"
      - "Hamoon Mousavi"
      - "Luke Schaeffer"
      - "Jeffrey Shallit"
    id: "https://doi.org/10.1142/S0129054116500386"
    type: paper
    location: "International Journal of Foundations of Computer Science 27(8) (2016), 943-963, Theorem 2"
    relationship: independently-proves
    note: >-
      Journal counterpart of preprint Theorem 57: Theorem 2 (checked in the
      authors' copy dated 2016-02-19) states that the Fibonacci word has
      subword complexity n + 1. The compared theorem b5_sturmian_projection
