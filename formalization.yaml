status:
  scope: >-
    Complete, unconditional Lean 4 + Mathlib proof of all 4 headline questions
    and observations (Q1, Q2, O1, O2) from Badkobeh and Ochem (2015) and all 10
    theorem parts of the companion manuscript (514 audited public declarations
    in BadkobehOchemB5, zero sorry, zero native_decide, standard axioms only):
    5-interval coding of b5 via the golden-ratio 3-interval exchange on
    (-phi^2/2, phi^3/2), exact factor complexity 4n + 1 for every n >= 0,
    exact language equality of g_fib(b5) with the Fibonacci word (complexity
    n + 1), exact language equality of g_rf(b5) with the Rote-Fibonacci word
    (complexity 2n for n >= 1), exact unattained critical exponent
    (5 + sqrt(5))/4 across all 338 seed buckets in-kernel, sharp second-order
    bound |w|/p < (5 + sqrt(5))/4 - (7 - sqrt(5))/(8p) with exact unattained
    deficit infimum (7 - sqrt(5))/4, asymptotic critical exponent
    E*(b5) = (5 + sqrt(5))/4, irrationality of E(b5), reversal-swap (3 <-> 4)
    invariance, ternary 3-IET collapse complexity 2n + 1, unbounded balance
    defect, and 5th-order A005252 prefix-length recurrence. The supporting
    library also proves square-freeness and F5 avoidance (both contained in
    Theorem 1 of Badkobeh and Ochem 2015) as corollaries; these are not
    among the compared statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

