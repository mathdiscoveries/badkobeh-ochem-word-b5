version: "v0.4"

project:
  name: "Badkobeh and Ochem's Word b5: Interval-Exchange Coding, Factor Complexity 4n + 1, Projections, and Critical Exponent"
  description: >-
    Unconditional Lean 4 + Mathlib formalization (514 audited declarations,
    zero sorry, zero native_decide, standard axioms only) resolving all four
    questions and observations (Q1, Q2, O1, O2) from Badkobeh and Ochem
    (Theoret. Comput. Sci. 588, 2015) for the 5-letter morphic fixed point b5
    = f5^omega(0) (0 -> 01, 1 -> 23, 2 -> 4, 3 -> 21, 4 -> 0). The library
    identifies b5 as the exact 5-interval coding of a golden-ratio 3-interval
    exchange on (-phi^2/2, phi^3/2) via the -1/phi left eigenvector, proving
    unconditionally that (Q1) b5 has exact factor complexity 4n + 1 for every
    n >= 0, (O1) g_fib(b5) has the exact same factors as the Fibonacci word
    with complexity n + 1, (O2) g_rf(b5) has the exact same factors as the
    Rote-Fibonacci word with complexity 2n for n >= 1, and (Q2) the critical
    exponent of b5 is exactly (5 + sqrt(5))/4 and is strictly unattained. It
    also proves the sharp second-order bound |w|/p < (5 + sqrt(5))/4 - (7 -
    sqrt(5))/(8p) with exact unattained deficit infimum (7 - sqrt(5))/4,
    asymptotic critical exponent E*(b5) = (5 + sqrt(5))/4, irrationality of
    E(b5), reversal-swap (3 <-> 4) language invariance, ternary 3-IET collapse
    complexity 2n + 1, unbounded balance defect, and the exact 5th-order
    length recurrence satisfied by f5-iterate lengths of every starting word
    (for the seed [0] the lengths are OEIS A005252(k + 3), offset zero; that
    single-seed identification is not stated in Lean). Companion manuscript
    and verification archive:
    https://mathdiscoveries.org/results/badkobeh-ochem-word-b5. Coverage by
    this package's Palomar comparison: the four headline questions and
    observations Q1, Q2, O1 and O2 are compared in Lean, 4 of 4 (100%); of the
    companion paper's 10 theorem parts, 2 are compared in full (20%; parts
    2(A) and 5(B)) and 6 in part (1(A), 2(B), 3(B), 4(A), 4(B) and 5(A); part
    1(A) is compared through its coding statement, not its orbit equation
    x_{p+1} = T(x_p)), and parts 1(B) and 3(A) are not compared. The
    supporting library has declarations for each uncompared part and piece;
    for Theorem 4(B) it proves the inverse-power formula E_j = phi^-(11 + 6j),
    and the paper's expansion of E_j in Fibonacci numbers is a further
    identity not stated in Lean.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.CO", "cs.FL"]
  msc2020: ["68R15", "37B10", "11B85"]

