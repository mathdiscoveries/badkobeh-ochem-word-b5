fidelity:
  divergences: >-
    None for the compared statements. All 4 of 4 headline questions and
    observations on mathdiscoveries.org/results/badkobeh-ochem-word-b5 are
    compared; of the 10 theorem parts of the companion manuscript (Draft 3), 2
    are compared in full and 6 in part; the supporting library has
    declarations for the rest, with the limits stated in project.description.
    The companion manuscript's Lemma lem:cut-noconn(1) asks only that the
    letter readout jump across every cut; the Lean theorem
    factorsOfLen_eq_range_of_iet also requires h_sep (any two points
    separated by a cut read different letters, so distinct components of
    the complement of the cuts carry distinct letters), without which the
    lemma's count can fail. The
    five-letter, ternary and binary codings to which the paper applies the
    lemma satisfy h_sep, so the compared results are unaffected.

