alignment:
  namespace: "BadkobehOchemB5Challenge"
  theorems:
    - name: "b5_codes_interval_translation"
      informal: "For every p >= 0, x_p = lambda'(b5[0..p)) lies strictly inside (-phi^2/2, phi^3/2) and b5(p) is uniquely determined by the 5 open subintervals P_2, P_0, P_4, P_1, P_3 of the golden-ratio 3-interval exchange."
    - name: "b5_factor_complexity"
      informal: "Question (Q1): For every n >= 0, b5 has exact factor complexity p_{b5}(n) = 4n + 1."
    - name: "b5_sturmian_projection"
      informal: "Observation (O1): For every n >= 0, g_fib(b5) has the exact same length-n factors as the Fibonacci word f and exact factor complexity n + 1."
    - name: "b5_rote_fibonacci_projection"
      informal: "Observation (O2): For every n >= 0, g_rf(b5) has the exact same length-n factors as the Rote-Fibonacci word r, and factor complexity 2n for n >= 1."
    - name: "b5_critical_exponent"
      informal: "Question (Q2): The critical exponent of b5 is exactly (5 + sqrt(5))/4 and is never attained by any factor."
    - name: "b5_sharp_second_order_and_deficit"
      informal: "Every factor w of b5 with period p >= 1 satisfies |w|/p < (5 + sqrt(5))/4 - (7 - sqrt(5))/(8p), and the infimum of the deficit phi*p - 2(|w| - p) is exactly (7 - sqrt(5))/4 and is never attained."
    - name: "b5_asymp_critExp_and_irrational"
      informal: "The asymptotic critical exponent E*(b5) equals (5 + sqrt(5))/4 for every period lower bound L, and E(b5) is irrational."
    - name: "b5_language_rev_swap34_invariant"
      informal: "The factor language of b5 is invariant under word reversal composed with the letter involution swapping 3 and 4."
    - name: "pi3B5_factor_complexity"
      informal: "The ternary 3-IET collapse pi_3(b5) has exact factor complexity 2n + 1 for every n >= 0."
    - name: "b5_not_C_balanced"
      informal: "The word b5 has unbounded balance defect: it is not C-balanced for any natural number C."
    - name: "fB5_iter_length_rec"
      informal: "Iterated lengths of f5 satisfy the exact 5th-order A005252 recurrence |f5^{k+5}(w)| + |f5^{k+2}(w)| = |f5^{k+4}(w)| + |f5^{k+3}(w)| + |f5^{k+1}(w)| + |f5^k(w)|."
