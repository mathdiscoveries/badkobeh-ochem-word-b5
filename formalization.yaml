  - title: "Characterization of some binary words with few squares"
    authors:
      - "Golnaz Badkobeh"
      - "Pascal Ochem"
    id: "https://doi.org/10.1016/j.tcs.2015.03.044"
    type: paper
    location: "Theoretical Computer Science 588 (2015), 73-80, Sections 3 and 5"
    relationship: independently-proves
    note: >-
      Introduces b5 = f5^omega(0), characterizes it by avoiding squares and the
      16 forbidden factors F5 (Theorem 1), and poses the factor complexity
      4n + 1, critical exponent (5 + sqrt(5))/4, and Fibonacci / Rote-Fibonacci
      projection problems (Sections 3 and 5). Section 3 establishes that the
      factor language of b5 is invariant under reversing a word and exchanging
      3 and 4; the compared theorem b5_language_rev_swap34_invariant gives an
      independent geometric proof (companion Theorem 5(A)). Read in full.
    author_endorsement: not-contacted
  - title: "More characterizations of morphic words"
    authors:
      - "Golnaz Badkobeh"
      - "Pascal Ochem"
    id: "https://arxiv.org/abs/2312.10757"
    type: paper
    location: "arXiv:2312.10757v2 (2025); Theoretical Computer Science 1072 (2026), 115875"
    relationship: background
    note: "Restates b5 and related morphic characterizations without proving its complexity, Fibonacci/Rote-Fibonacci projections, or critical exponent."
    author_endorsement: not-contacted
  - title: "Decision algorithms for Fibonacci-automatic words, II: Related sequences and avoidability"
    authors:
      - "Chen Fei Du"
      - "Hamoon Mousavi"
      - "Eric Rowland"
      - "Luke Schaeffer"
      - "Jeffrey Shallit"
    id: "https://doi.org/10.1016/j.tcs.2016.10.005"
    type: paper
    location: "Theoretical Computer Science 657 (2017), 146-162, Theorem 7"
    relationship: independently-proves
    note: >-
      Journal version of part of arXiv:1406.0670 (listed separately below).
