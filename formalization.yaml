    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/badkobeh-ochem-word-b5"
    type: paper
    location: "https://mathdiscoveries.org/results/badkobeh-ochem-word-b5"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The companion paper. It states and proves in writing every compared
      statement of this package (Theorems 1(A), 2(A), 2(B), 3(B), 4(A), 4(B),
      5(A) and 5(B)), and the Lean work formalizes them; the formalization
