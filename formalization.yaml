    id: "https://doi.org/10.2307/2371431"
    type: paper
    location: "American Journal of Mathematics 62(1) (1940), 1-42, Theorem 3.7 and Section 7"
    relationship: independently-proves
    note: >-
      Read in the OCR text of the public archive.org scan of volume 62 (item
      sim_american-journal-of-mathematics_1940_62): Sections 1 and 2, Theorems
