      338 short seeds in the proof of Theorem 4 is stated and explained in the
      paper and is evaluated in the Lean kernel here. The paper answers both
      questions (Q1, Q2) and both observations (O1, O2) of Badkobeh and Ochem
      (2015), listed below. No prior proof of Q1, Q2, O1 or O2 was found in
      the searches logged; Badkobeh and Ochem (2015) and their sequel
      (arXiv:2312.10757v2, author copy of Theoret. Comput. Sci. 1072 (2026),
